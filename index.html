<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><meta name="robots" content="noindex"></head><body><meta name="claude:viewport-fit-sides" content="cover">
<title>Прописи по уроку</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Замысел. Прототип показывает, как тренажёр выглядел бы внутри вкладки
   «Иероглифы → Мои уроки» на okchinese: те же тёмные поверхности, плашки,
   вкладки и кнопки, что у сайта. Цвета сняты с okchinese.ru (ноябрь 2026).

   Все цвета и шрифты названы здесь один раз. Остальной код берёт их по именам.
   Сайт работает только в тёмной теме, поэтому и прототип тёмный всегда. */
:root {
  color-scheme: dark;

  --bg: #07080e;                 /* фон страницы */
  --panel: #27272a;              /* плитки, панели, вкладки, второстепенные кнопки */
  --panel-2: #3f3f46;            /* нейтральные плашки */
  --surface: rgba(255, 255, 255, 0.04);   /* блоки внутри панели */
  --line: rgba(255, 255, 255, 0.08);      /* тонкие рамки */
  --seg-active: #09090b;         /* выбранная вкладка */
  --text: #fafafa;
  --muted: #a1a1aa;
  --faint: rgba(255, 255, 255, 0.4);
  --button: #fafafa;             /* основная кнопка: белая */
  --button-text: #18181b;
  --pinyin: #ec4899;             /* пиньинь, как в «Карточках» */
  --accent: rgb(196, 30, 58);    /* фирменный малиновый */

  /* Статусы, как у плашек сайта */
  --success: rgb(52, 211, 153);
  --success-weak: rgba(52, 211, 153, 0.16);
  --warning: #fcd34d;
  --warning-weak: rgba(245, 158, 11, 0.16);
  --danger: #fca5a5;
  --danger-weak: rgba(239, 68, 68, 0.16);

  /* Части иероглифа: на тёмном фоне и на белом листе */
  --meaning: #60a5fa;            /* ключ: синий, как «Легко» и дуга «новые» */
  --sound: rgb(245, 184, 84);    /* фонетик: янтарный, как «Трудно» */
  --meaning-ink: #1d4ed8;
  --sound-ink: #b45309;

  /* Белый лист для письма, как в тренажёре сайта */
  --paper: #ffffff;
  --paper-ink: #18181b;
  --paper-guide: rgba(24, 24, 27, 0.22);
  --trace: rgba(24, 24, 27, 0.18);        /* контур-подсказка */
  --trace-faint: rgba(24, 24, 27, 0.08);  /* бледный контур */
  --highlight: #0f766e;                   /* подсветка черты: «нефрит» из палитры сайта */

  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 20px;

  --font-body: "Geist", "Inter", "Segoe UI", system-ui, sans-serif;
  --font-hanzi: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

body { background: var(--bg); color: var(--text); }
</style>
<link rel="stylesheet" href="styles.css">

<!-- Сюда app.js подставляет нужный экран: список урока, разбор, письмо или итог. -->
<div class="app" id="app">
  <p class="boot">Открываю тренажёр…</p>
</div>

<!-- Порядок важен: сначала библиотека для письма, потом данные, потом логика. -->
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js"></script>
<script src="strokes.js"></script>
<script src="lesson.js"></script>
<script src="app.js"></script>
</body></html>
